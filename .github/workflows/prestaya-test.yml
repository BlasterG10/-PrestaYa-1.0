name: PrestaYa beta test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate beta 0.9
        run: node tests/prestaya_beta_0_9_test.js
