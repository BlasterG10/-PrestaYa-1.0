<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrestaYa 1.0 — UI Visual</title>
<style>html,body,#frame{margin:0;width:100%;height:100%;border:0}body{overflow:hidden;background:#f5f7fb}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f5f7fb;color:#172033;font:600 15px system-ui;z-index:10}</style>
</head>
<body>
<div id="loading">Preparando tu espacio PrestaYa…</div>
<iframe id="frame" src="./prestaya_beta_1_2.html" title="PrestaYa 1.0"></iframe>
<script>
const frame=document.getElementById('frame');
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=w.document;
 const s=d.createElement('style');s.id='prestayaVisualSystem';
 s.textContent=`
 :root{--py-primary:#2457d6;--py-primary-2:#173ea5;--py-ink:#172033;--py-muted:#667085;--py-bg:#f5f7fb;--py-card:#fff;--py-border:#e7eaf0;--py-success:#087443;--py-warning:#a15c00;--py-danger:#b42318;--py-shadow:0 12px 35px rgba(16,24,40,.07)}
 *{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;background:var(--py-bg)!important;color:var(--py-ink)!important}
 .login{background:radial-gradient(circle at 20% 10%,#dce8ff 0,#eef3ff 35%,#f8f9fc 75%)!important;padding:24px!important}
 .box{width:min(980px,100%)!important;border-radius:28px!important;padding:0!important;overflow:hidden!important;box-shadow:0 30px 80px rgba(16,24,40,.14)!important;display:grid!important;grid-template-columns:1.05fr .95fr!important}
 .box:before{content:'Presta Ya\\A\\AControla tu cartera. Gestiona préstamos.\\AConsulta y cobra con claridad.';white-space:pre-wrap;display:flex;align-items:center;padding:48px;background:linear-gradient(145deg,var(--py-primary-2),var(--py-primary));color:#fff;font-size:30px;font-weight:800;line-height:1.18;letter-spacing:-.03em}
 .box>*{margin-left:34px;margin-right:34px}.box h1{margin-top:38px;font-size:28px}.box p{margin-bottom:20px}.box label{margin-top:14px}.box button{border-radius:12px;padding:13px 16px;box-shadow:0 8px 20px rgba(36,87,214,.2)}
 .app{background:var(--py-bg)!important}.side{width:260px!important;background:#101828!important;padding:22px 16px!important;box-shadow:12px 0 35px rgba(16,24,40,.08)}.side h2{padding:0 10px;font-size:23px}.side .muted{color:#98a2b3!important}.side button{border-radius:11px!important;padding:12px 13px!important;color:#cfd6e4!important}.side button.active,.side button:hover{background:#1d2939!important;color:#fff!important}.side .secondary{width:calc(100% - 20px);margin-left:10px;background:#fff!important;color:#172033!important}
 .main{margin-left:260px!important;padding:30px!important}.top{align-items:end;margin-bottom:24px!important}.top h2{font-size:30px!important;letter-spacing:-.03em;margin-bottom:5px}.top #who{background:#fff;padding:9px 12px;border:1px solid var(--py-border);border-radius:999px}
 .grid{gap:16px!important}.stat,.card{border:1px solid var(--py-border)!important;box-shadow:var(--py-shadow)!important;border-radius:18px!important}.stat{padding:20px!important;min-height:92px}.stat:after{content:'↗';float:right;margin-top:-25px;color:var(--py-primary);font-weight:900}.stat b{font-size:27px!important}.card{padding:22px!important}.card h3{font-size:18px;margin-top:0}.notice{border:1px solid #dbe5ff!important;background:#f2f6ff!important;border-radius:12px!important}.warn{background:#fff8ed!important}.ok{background:#ecfdf3!important}.bad{background:#fef3f2!important}
 input,select,textarea{border:1px solid #d7dce5!important;border-radius:11px!important;padding:11px 12px!important;outline:none;transition:.18s}.primary{background:linear-gradient(135deg,var(--py-primary),#3478f6)!important;border-radius:11px!important}.secondary{border:1px solid #d7dce5!important;border-radius:11px!important}.actions{gap:9px!important}
 table{border:1px solid var(--py-border);border-radius:14px;overflow:hidden}th{background:#f8fafc!important;color:#667085!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.04em}th,td{padding:13px!important}tbody tr:hover{background:#f8fafc}.badge{border-radius:999px!important}.customerHero{background:linear-gradient(135deg,#1740a7,#2864df)!important;border:0!important}.customerHero .muted{color:#dbe7ff!important}
 .methods{gap:12px!important}.method{border-radius:14px!important;padding:14px!important}.method.selected{outline:3px solid #a9c4ff!important;box-shadow:0 8px 22px rgba(36,87,214,.12)}
 #loanRequests .requestIntro,#supervisorIds .idHeader,#loans .loanScope{border-radius:14px!important;padding:15px!important}.toast{box-shadow:0 12px 35px rgba(16,24,40,.2)}
 @media(max-width:900px){.box{grid-template-columns:1fr!important}.box:before{display:none}.side{position:static!important;width:100%!important;height:auto!important}.main{margin-left:0!important;padding:16px!important}.side button{display:inline-block!important;width:auto!important}.side h2{display:inline-block;margin-right:12px}.side #staffNav,.side #clientNav{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.side #staffNav button,.side #clientNav button{white-space:nowrap}.side .secondary{margin:8px 10px;width:auto}}
 @media(max-width:600px){.top h2{font-size:24px!important}.grid{grid-template-columns:1fr!important}.box{border-radius:18px!important}.main{padding:12px!important}.card{padding:16px!important}}
 `;
 d.head.appendChild(s);
 // Make the visual system explicit without replacing the existing application logic.
 const role=d.getElementById('roleLabel');
 if(role){const obs=new MutationObserver(()=>{d.body.dataset.pyRole=(role.textContent||'').toLowerCase()});obs.observe(role,{childList:true,subtree:true});}
 document.getElementById('loading').style.display='none';
});
</script>
</body>
</html>
