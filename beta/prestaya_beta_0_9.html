<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrestaYa 0.9</title><style>html,body,#appFrame{margin:0;width:100%;height:100%;border:0}body{overflow:hidden;background:#f4f6f8}#fallback{position:fixed;inset:0;display:grid;place-items:center;font:16px Arial;color:#172033;background:#f4f6f8;z-index:10}</style></head>
<body><div id="fallback">Cargando PrestaYa 0.9…</div><iframe id="appFrame" src="./prestaya_beta_0_8.html" title="PrestaYa"></iframe>
<script>
(function(){const f=document.getElementById('appFrame'),fb=document.getElementById('fallback');let done=false;
function doc(){try{return f.contentDocument||f.contentWindow.document}catch(e){return null}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return 'RD$'+Number(n||0).toLocaleString('es-DO',{minimumFractionDigits:2})}
function arr(w,k){try{return JSON.parse(w.localStorage.getItem(k)||'[]')}catch(e){return[]}}
function enhance(){const d=doc();if(!d||!d.body){setTimeout(enhance,250);return}if(done)return;done=true;fb.style.display='none';const w=f.contentWindow,nav=d.getElementById('staffNav'),main=d.querySelector('.main');if(!nav||!main)return;
const css=d.createElement('style');css.textContent='.pya09box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 25px #0001;margin-bottom:15px}.pya09grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pya09stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.pya09stat small{color:#667085}.pya09stat b{display:block;font-size:23px;margin-top:6px}.pya09search{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px}.pya09table{overflow:auto}.pya09table table{width:100%;border-collapse:collapse}.pya09table th,.pya09table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px;white-space:nowrap}.pya09lock{background:#fff7ed;border-left:4px solid #f59e0b;padding:11px;border-radius:8px}@media(max-width:800px){.pya09grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.pya09grid{grid-template-columns:1fr}.pya09search{grid-template-columns:1fr}}';d.head.appendChild(css);
/* Employee administration: visible only to Administrator. */
let eb=d.getElementById('pya09EmployeesBtn');if(!eb){eb=d.createElement('button');eb.id='pya09EmployeesBtn';eb.textContent='👔 Empleados';eb.onclick=()=>w.show('pya09Employees',eb);nav.appendChild(eb)}
let es=d.getElementById('pya09Employees');if(!es){es=d.createElement('section');es.id='pya09Employees';es.className='sec';es.innerHTML='<div class="pya09box"><h3>Administración de empleados</h3><div class="pya09lock"><b>Solo el Administrador</b> puede agregar empleados y asignar niveles.</div><div class="formgrid"><div><label>Nombre completo</label><input id="pya09EmpName"></div><div><label>Número de empleado (6 dígitos)</label><input id="pya09EmpNo" maxlength="6" inputmode="numeric"></div><div><label>Usuario</label><input id="pya09EmpUser"></div><div><label>Contraseña inicial</label><input id="pya09EmpPass" type="password"></div><div><label>Nivel</label><select id="pya09EmpRole"><option value="supervisor">Supervisor</option><option value="empleado">Empleado / Cobrador</option></select></div></div><button class="p" style="margin-top:12px" onclick="pya09AddEmployee()">Agregar empleado</button></div><div class="pya09box"><h3>Empleados registrados</h3><div class="pya09table"><table><thead><tr><th>N.º empleado</th><th>Nombre</th><th>Usuario</th><th>Nivel</th><th>Restricciones</th></tr></thead><tbody id="pya09EmpRows"></tbody></table></div></div>';main.appendChild(es)}
/* Customer analysis: visible only to Admin/Supervisor. */
let ab=d.getElementById('pya09AnalysisBtn');if(!ab){ab=d.createElement('button');ab.id='pya09AnalysisBtn';ab.textContent='📈 Análisis de clientes';ab.onclick=()=>w.show('pya09Analysis',ab);nav.appendChild(ab)}
let as=d.getElementById('pya09Analysis');if(!as){as=d.createElement('section');as.id='pya09Analysis';as.className='sec';as.innerHTML='<div class="pya09box"><h3>Análisis de clientes</h3><div class="pya09lock"><b>Acceso exclusivo:</b> Administrador y Supervisor.</div><div class="pya09search"><input id="pya09Search" placeholder="Buscar por nombre, documento o número de cliente"><button class="s" onclick="document.getElementById(\'pya09Search\').value=\'\';pya09Render()">Limpiar</button></div><div class="pya09grid"><div class="pya09stat"><small>Clientes registrados</small><b id="aClients">0</b></div><div class="pya09stat"><small>Clientes con préstamo</small><b id="aBorrowers">0</b></div><div class="pya09stat"><small>Préstamos activos</small><b id="aActive">0</b></div><div class="pya09stat"><small>Saldo pendiente</small><b id="aDebt">RD$0.00</b></div></div></div><div class="pya09box"><h3>Resumen por cliente</h3><div class="pya09table"><table><thead><tr><th>Cliente</th><th>N.º cliente</th><th>Documento</th><th>Préstamos</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr></thead><tbody id="aRows"></tbody></table></div></div>';main.appendChild(as)}
const oldShow=w.show;if(typeof oldShow==='function'&&!w.__pya09show){w.__pya09show=true;w.show=function(id,b){if(id==='pya09Employees'&&w.role!=='admin'){alert('Solo el Administrador puede acceder a Empleados.');return}if(id==='pya09Analysis'&&w.role!=='admin'&&w.role!=='supervisor'){alert('El análisis de clientes es exclusivo del Administrador y Supervisor.');return}if(id==='approvals'&&w.role!=='admin'&&w.role!=='supervisor'){alert('Aprobaciones es exclusivo del Administrador y Supervisor.');return}oldShow(id,b);pya09Permissions();if(id==='pya09Analysis')pya09Render()}}
function pya09Permissions(){const r=w.role;d.getElementById('pya09EmployeesBtn').style.display=r==='admin'?'':'none';d.getElementById('pya09AnalysisBtn').style.display=(r==='admin'||r==='supervisor')?'':'none';const a=Array.from(nav.querySelectorAll('button')).find(x=>x.textContent.includes('Aprobaciones'));if(a)a.style.display=(r==='admin'||r==='supervisor')?'':'none';pya09RenderEmployees();pya09Render()}
function pya09RenderEmployees(){const t=d.getElementById('pya09EmpRows');if(!t)return;const es=w.pyaEmployees||arr(w,'prestaya_employees_v2');w.pyaEmployees=es;t.innerHTML=es.map(e=>'<tr><td>'+esc(e.number)+'</td><td>'+esc(e.name)+'</td><td>'+esc(e.user)+'</td><td>'+esc(e.role==='supervisor'?'Supervisor':'Empleado / Cobrador')+'</td><td>'+esc(e.role==='supervisor'?'Puede aprobar solicitudes y cambios financieros.':'Puede registrar clientes, solicitar préstamos y registrar pagos; no puede aprobar ni ver análisis.')+'</td></tr>').join('')||'<tr><td colspan="5">No hay empleados registrados.</td></tr>'}
w.pya09AddEmployee=function(){if(w.role!=='admin'){alert('Solo el Administrador puede agregar empleados.');return}const n=d.getElementById('pya09EmpName').value.trim(),num=d.getElementById('pya09EmpNo').value.trim(),u=d.getElementById('pya09EmpUser').value.trim(),p=d.getElementById('pya09EmpPass').value,r=d.getElementById('pya09EmpRole').value;if(!n||!/^[0-9]{6}$/.test(num)||!u||!p){alert('Completa todos los campos y usa un número de empleado de 6 dígitos.');return}const es=w.pyaEmployees||[];if(es.some(e=>e.number===num||e.user.toLowerCase()===u.toLowerCase())){alert('El número de empleado o usuario ya existe.');return}es.push({id:crypto.randomUUID?crypto.randomUUID():'e'+Date.now(),name:n,number:num,user:u,pass:p,role:r,createdAt:new Date().toISOString()});w.pyaEmployees=es;w.localStorage.setItem('prestaya_employees_v2',JSON.stringify(es));['pya09EmpName','pya09EmpNo','pya09EmpUser','pya09EmpPass'].forEach(id=>d.getElementById(id).value='');pya09RenderEmployees();alert('Empleado agregado correctamente.')}
function pya09Render(){if(w.role!=='admin'&&w.role!=='supervisor'){d.getElementById('pya09AnalysisBtn').style.display='none';d.getElementById('pya09Analysis').style.display='none';return}const cs=arr(w,'prestaya_clients'),ls=arr(w,'prestaya_loans'),ps=arr(w,'prestaya_payments'),q=(d.getElementById('pya09Search')?.value||'').toLowerCase();const approved=ls.filter(l=>l.status==='Aprobado');const paid=l=>ps.filter(p=>p.loanId===l.id).reduce((a,p)=>a+Number(p.amount||0),0);const filtered=cs.filter(c=>!q||[c.name,c.id,c.clientNumber,c.clientNo,c.idnum,c.documentNumber].some(v=>String(v??'').toLowerCase().includes(q)));const scoped=approved.filter(l=>filtered.some(c=>c.id===l.clientId));d.getElementById('aClients').textContent=filtered.length;d.getElementById('aBorrowers').textContent=new Set(scoped.map(l=>l.clientId)).size;d.getElementById('aActive').textContent=scoped.filter(l=>paid(l)<Number(l.total||0)).length;d.getElementById('aDebt').textContent=money(scoped.reduce((a,l)=>a+Math.max(0,Number(l.total||0)-paid(l)),0));d.getElementById('aRows').innerHTML=filtered.map(c=>{const mine=approved.filter(l=>l.clientId===c.id),p=mine.reduce((a,l)=>a+paid(l),0),debt=mine.reduce((a,l)=>a+Math.max(0,Number(l.total||0)-paid(l)),0);return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.clientNumber||c.clientNo||c.id?.slice(0,6)||'—')+'</td><td>'+esc(c.idnum||c.documentNumber||'—')+'</td><td>'+mine.length+'</td><td>'+money(p)+'</td><td>'+money(debt)+'</td><td>'+ (debt?'Con saldo':'Sin saldo')+'</td></tr>'}).join('')||'<tr><td colspan="7">No hay clientes.</td></tr>'}
d.getElementById('pya09Search').addEventListener('input',pya09Render);pya09Permissions();setInterval(pya09Permissions,1000);
}
f.addEventListener('load',enhance);setTimeout(enhance,400)})();
</script></body></html>
