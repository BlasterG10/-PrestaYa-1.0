<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presta Ya — Inicia sesión</title>
<style>
:root{--navy:#061a2d;--navy2:#0a2945;--blue:#1877f2;--ink:#152238;--muted:#71819a;--line:#d7e1ee}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--navy)}body{overflow-x:hidden}.page{min-height:100svh;background:radial-gradient(900px 650px at 100% 18%,#174a78 0%,transparent 55%),linear-gradient(135deg,#06192c 0%,#08233c 55%,#061a2d 100%);padding:48px 28px 70px;position:relative}.page:after{content:"";position:absolute;left:-12%;right:-12%;bottom:-180px;height:330px;background:linear-gradient(165deg,transparent 0 27%,#0a2c4e 28% 100%);transform:rotate(-3deg);pointer-events:none}.shell{position:relative;z-index:1;width:min(738px,100%);margin:0 auto;background:#fff;border-radius:38px;padding:77px 49px 68px;box-shadow:0 24px 65px #00112070}.brand{display:flex;align-items:center;gap:18px;margin-bottom:64px}.logo{width:67px;height:67px;border-radius:17px;background:linear-gradient(145deg,#2c82ff,#1469e8);display:grid;place-items:center;box-shadow:0 6px 14px #1267e822}.logo:before,.logo:after{content:"";position:absolute;width:36px;height:11px;border-radius:9px;background:#fff;transform:skew(-28deg)}.logo:before{margin-top:-14px;margin-left:1px}.logo:after{margin-top:13px;margin-left:-6px}.brandname{font-size:41px;font-weight:800;letter-spacing:-1.8px}.brandname span{color:#1976f3}.title{font-size:55px;line-height:1.05;letter-spacing:-2.2px;margin:0 0 21px;font-weight:800}.subtitle{font-size:29px;line-height:1.3;color:var(--muted);margin:0 0 76px}.field{margin-bottom:37px}.label{display:block;font-size:25px;font-weight:800;margin:0 0 16px}.inputwrap{position:relative}.input,.select{width:100%;height:97px;border:2px solid var(--line);border-radius:21px;background:#fff;padding:0 28px;font-size:27px;color:#151a22;outline:0}.input::placeholder{color:#a5a9b0}.input:focus,.select:focus{border-color:#8db5ec;box-shadow:0 0 0 4px #1877f214}.eye{position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:28px;color:#75869e}.select{appearance:auto;padding-right:25px}.submit{width:100%;height:97px;border:0;border-radius:21px;background:linear-gradient(135deg,#217df7,#1772ef);color:#fff;font-size:29px;font-weight:800;box-shadow:0 12px 28px #1877f238;margin-top:3px}.options{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:34px;font-size:26px;color:var(--muted)}.remember{display:flex;align-items:center;gap:12px}.remember input{appearance:none;width:27px;height:27px;border:3px solid #8d9198;border-radius:8px;margin:0;background:#fff}.remember input:checked{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 5px #fff}.forgot{color:#1473ed;font-weight:800;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}.divider{height:2px;background:#e9edf2;margin:103px 0 47px}.quote{text-align:center;color:#71819a;font-size:25px;line-height:1.4}.demo{display:none}.app{display:none;position:fixed;inset:0;background:#f4f7fb;z-index:20}.app iframe{width:100%;height:100%;border:0}.close{position:fixed;right:18px;top:18px;z-index:30;border:0;border-radius:50%;width:48px;height:48px;background:#fff;color:#182438;font-size:25px;box-shadow:0 6px 20px #10233a22;display:none}
@media(max-width:600px){.page{padding:49px 47px 95px;min-height:100svh}.shell{width:100%;border-radius:39px;padding:77px 49px 66px;box-shadow:0 20px 55px #00112060}.brand{gap:17px;margin-bottom:64px}.logo{width:67px;height:67px}.brandname{font-size:40px}.title{font-size:54px}.subtitle{font-size:28px;margin-bottom:75px}.label{font-size:25px}.field{margin-bottom:36px}.input,.select,.submit{height:97px;border-radius:21px}.input,.select{font-size:26px;padding-left:28px}.submit{font-size:29px}.options{font-size:25px;margin-top:34px}.divider{margin-top:103px;margin-bottom:46px}.quote{font-size:24px}}
@media(max-width:430px){.page{padding:28px 18px 70px}.shell{padding:45px 25px 42px;border-radius:28px}.brand{margin-bottom:40px}.logo{width:55px;height:55px;border-radius:14px}.brandname{font-size:31px}.title{font-size:42px}.subtitle{font-size:22px;margin-bottom:48px}.label{font-size:19px;margin-bottom:11px}.field{margin-bottom:25px}.input,.select,.submit{height:68px;border-radius:15px}.input,.select{font-size:19px;padding-left:19px}.submit{font-size:21px}.options{font-size:18px;margin-top:22px}.remember input{width:23px;height:23px}.forgot{white-space:normal;text-align:right}.divider{margin:63px 0 32px}.quote{font-size:18px}}
</style>
</head>
<body>
<main class="page">
<section class="shell" id="loginCard">
<div class="brand"><div class="logo" aria-hidden="true"></div><div class="brandname">Presta <span>Ya</span></div></div>
<h1 class="title">Inicia sesión</h1>
<p class="subtitle">Accede a tu cuenta para continuar.</p>
<form id="loginForm">
<div class="field"><label class="label" for="email">Correo electrónico</label><input class="input" id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required></div>
<div class="field"><label class="label" for="password">Contraseña</label><div class="inputwrap"><input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button class="eye" type="button" aria-label="Mostrar contraseña" id="eye">◉</button></div></div>
<div class="field"><label class="label" for="role">Tipo de cuenta</label><select class="select" id="role"><option value="client">Cliente</option><option value="admin">Administrador</option><option value="supervisor">Supervisor</option><option value="collector">Cobrador</option></select></div>
<button class="submit" type="submit">Iniciar sesión</button>
<div class="options"><label class="remember"><input type="checkbox" id="remember"> <span>Recordarme</span></label><a class="forgot" href="#" id="forgot">¿Olvidaste tu contraseña?</a></div>
</form>
<div class="divider"></div><div class="quote">“Hoy es un paso más cerca de tus sueños.”</div>
</section></main>
<section class="app" id="app"><button class="close" id="close" aria-label="Cerrar">×</button><iframe id="appFrame" title="Presta Ya"></iframe></section>
<script>
const form=document.getElementById('loginForm'),pw=document.getElementById('password'),eye=document.getElementById('eye'),app=document.getElementById('app'),frame=document.getElementById('appFrame'),close=document.getElementById('close');
eye.onclick=()=>{pw.type=pw.type==='password'?'text':'password';eye.textContent=pw.type==='password'?'◉':'◉'};
document.getElementById('forgot').onclick=e=>{e.preventDefault();alert('La recuperación de contraseña estará disponible al conectar la autenticación de producción.')};
form.onsubmit=e=>{e.preventDefault();const role=document.getElementById('role').value;sessionStorage.setItem('prestaya_role',role);frame.src='./prestaya_beta_1_2.html';app.style.display='block';close.style.display='block'};
close.onclick=()=>{app.style.display='none';close.style.display='none'};
</script>
</body>
</html>
