name: PrestaYa Visual QA
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run visual QA contract
        run: node qa/visual-qa.mjs
