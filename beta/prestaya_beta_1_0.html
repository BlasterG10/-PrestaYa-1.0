<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrestaYa 1.0</title><style>html,body,#appFrame{margin:0;width:100%;height:100%;border:0}body{overflow:hidden;background:#f4f6f8}#loading{position:fixed;inset:0;display:grid;place-items:center;font:16px Arial;background:#f4f6f8;z-index:10}</style></head><body><div id="loading">Cargando PrestaYa 1.0…</div><iframe id="appFrame" src="./microprestamos_beta_0_7.html" title="PrestaYa"></iframe><script>(function(){const f=document.getElementById('appFrame'),loading=document.getElementById('loading');function start(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.body){setTimeout(start,200);return}loading.style.display='none';if(d.getElementById('pya10css'))return;const s=d.createElement('style');s.id='pya10css';s.textContent='.pya10{background:#fff;border-radius:15px;padding:20px;margin-bottom:15px;box-shadow:0 5px 25px #0001}.pya10grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pya10search{display:flex;gap:10px;margin-bottom:14px}.pya10search input{flex:1}.pya10table{overflow:auto}.pya10table table{width:100%;border-collapse:collapse}.pya10table th,.pya10table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;font-size:13px;white-space:nowrap}.pya10lock{background:#fff7ed;border-left:4px solid #f59e0b;padding:11px;border-radius:8px}@media(max-width:600px){.pya10grid{grid-template-columns:1fr}.pya10search{display:grid;grid-template-columns:1fr}}';d.head.appendChild(s);const nav=d.getElementById('staffNav'),main=d.querySelector('.main');if(!nav||!main)return;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function arr(k){try{return JSON.parse(w.localStorage.getItem(k)||'[]')}catch(e){return[]}}function money(n){return 'RD$'+Number(n||0).toLocaleString('es-DO',{minimumFractionDigits:2})}function clientNo(c){return c.clientNumber||c.clientNo||c.numeroCliente||c.id?.slice(0,6)||'—'}function paid(l,ps){return ps.filter(p=>p.loanId===l.id).reduce((a,p)=>a+Number(p.amount||0),0)}
let eb=d.createElement('button');eb.id='pya10EmpBtn';eb.textContent='👔 Empleados';nav.appendChild(eb);eb.onclick=()=>w.show('pya10Employees',eb);let es=d.createElement('section');es.id='pya10Employees';es.className='sec';es.innerHTML='<div class="pya10"><h3>Administración de empleados</h3><div class="pya10lock"><b>Solo Administrador.</b> Aquí se registran los usuarios internos y su nivel de acceso.</div><div class="pya10grid"><div><label>Nombre completo</label><input id="p10name"></div><div><label>Número de empleado (6 dígitos)</label><input id="p10num" maxlength="6" inputmode="numeric"></div><div><label>Usuario</label><input id="p10user"></div><div><label>Contraseña inicial</label><input id="p10pass" type="password"></div><div><label>Nivel</label><select id="p10role"><option value="supervisor">Supervisor</option><option value="empleado">Empleado / Cobrador</option></select></div></div><button class="p" style="margin-top:12px" onclick="pya10AddEmployee()">Agregar empleado</button></div><div class="pya10"><h3>Empleados registrados</h3><div class="pya10table"><table><thead><tr><th>N.º empleado</th><th>Nombre</th><th>Usuario</th><th>Nivel</th><th>Restricciones</th></tr></thead><tbody id="p10emps"></tbody></table></div></div>';main.appendChild(es);
let ab=d.createElement('button');ab.id='pya10AnalysisBtn';ab.textContent='📈 Análisis de clientes';nav.appendChild(ab);ab.onclick=()=>w.show('pya10Analysis',ab);let as=d.createElement('section');as.id='pya10Analysis';as.className='sec';as.innerHTML='<div class="pya10"><h3>Análisis de clientes</h3><div class="pya10lock"><b>Acceso exclusivo:</b> Administrador y Supervisor.</div><div class="pya10search"><input id="p10search" placeholder="Buscar por nombre, documento o número de cliente"><button class="s" onclick="p10search.value=\'\';pya10Analysis()">Limpiar</button></div><div class="pya10table"><table><thead><tr><th>Cliente</th><th>N.º cliente</th><th>Documento</th><th>Préstamos</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr></thead><tbody id="p10analysisRows"></tbody></table></div></div>';main.appendChild(as);
let pb=d.createElement('button');pb.id='pya10PendingBtn';pb.textContent='⏳ Préstamos pendientes';nav.appendChild(pb);pb.onclick=()=>w.show('pya10Pending',pb);let ps=d.createElement('section');ps.id='pya10Pending';ps.className='sec';ps.innerHTML='<div class="pya10"><h3>Préstamos pendientes</h3><p class="muted">Solicitudes registradas antes de aprobación. Se conserva quién solicitó y quién aprueba.</p><div class="pya10table"><table><thead><tr><th>N.º préstamo</th><th>Cliente</th><th>Monto</th><th>Tipo</th><th>Solicitado por</th><th>Estado</th><th>Aprobado por</th></tr></thead><tbody id="p10pendingRows"></tbody></table></div></div>';main.appendChild(ps);
function employees(){let e=arr('prestaya_employees');let t=d.getElementById('p10emps');if(!t)return;t.innerHTML=e.map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.user)+'</td><td>'+esc(x.role==='supervisor'?'Supervisor':'Empleado / Cobrador')+'</td><td>'+esc(x.role==='supervisor'?'Aprueba solicitudes y cambios financieros.':'Registra clientes, solicita préstamos y registra pagos; no aprueba.')+'</td></tr>').join('')||'<tr><td colspan="5">No hay empleados registrados.</td></tr>'}w.pya10AddEmployee=function(){if(w.role!=='admin'){alert('Solo el Administrador puede agregar empleados.');return}let name=d.getElementById('p10name').value.trim(),number=d.getElementById('p10num').value.trim(),user=d.getElementById('p10user').value.trim(),pass=d.getElementById('p10pass').value,role=d.getElementById('p10role').value;if(!name||!/^[0-9]{6}$/.test(number)||!user||!pass){alert('Completa los datos y usa exactamente 6 dígitos.');return}let e=arr('prestaya_employees');if(e.some(x=>x.number===number||x.user.toLowerCase()===user.toLowerCase())){alert('El número de empleado o usuario ya existe.');return}e.push({id:crypto.randomUUID?crypto.randomUUID():'e'+Date.now(),name,number,user,pass,role,createdAt:new Date().toISOString()});w.localStorage.setItem('prestaya_employees',JSON.stringify(e));employees();['p10name','p10num','p10user','p10pass'].forEach(id=>d.getElementById(id).value='');alert('Empleado registrado.')}function pya10Analysis(){if(w.role!=='admin'&&w.role!=='supervisor')return;let cs=arr('prestaya_clients'),ls=arr('prestaya_loans'),pss=arr('prestaya_payments'),q=(d.getElementById('p10search')?.value||'').toLowerCase(),filtered=cs.filter(c=>!q||[c.name,c.idnum,c.documentNumber,clientNo(c)].some(v=>String(v??'').toLowerCase().includes(q))),approved=ls.filter(l=>l.status==='Aprobado'),rows=d.getElementById('p10analysisRows');if(!rows)return;rows.innerHTML=filtered.map(c=>{let ml=approved.filter(l=>l.clientId===c.id),p=ml.reduce((a,l)=>a+paid(l,pss),0),debt=ml.reduce((a,l)=>a+Math.max(0,Number(l.total||0)-paid(l,pss)),0);return '<tr><td>'+esc(c.name)+'</td><td>'+esc(clientNo(c))+'</td><td>'+esc(c.idnum||c.documentNumber||'—')+'</td><td>'+ml.length+'</td><td>'+money(p)+'</td><td>'+money(debt)+'</td><td>'+(debt?'Con saldo':'Sin saldo')+'</td></tr>'}).join('')||'<tr><td colspan="7">No hay clientes.</td></tr>'}function pending(){let ls=arr('prestaya_loans'),cs=arr('prestaya_clients'),rows=d.getElementById('p10pendingRows');if(!rows)return;rows.innerHTML=ls.filter(l=>l.status==='Pendiente').map(l=>{let c=cs.find(x=>x.id===l.clientId);return '<tr><td>'+esc(l.loanNumber||l.id?.slice(0,6)||'—')+'</td><td>'+esc(c?.name||'—')+'</td><td>'+money(l.amount)+'</td><td>'+esc(l.type==='flash'?'Flash':'Micro')+'</td><td>'+esc(l.requestedByName||l.requestedBy||'Empleado')+(l.requestedByNumber?' (#'+esc(l.requestedByNumber)+')':'')+'</td><td>Pendiente</td><td>'+esc(l.approvedByName||'—')+'</td></tr>'}).join('')||'<tr><td colspan="7">No hay préstamos pendientes.</td></tr>'}
const oldShow=w.show;if(typeof oldShow==='function'){w.show=function(id,btn){if(id==='pya10Employees'&&w.role!=='admin'){alert('Solo el Administrador puede acceder a Empleados.');return}if(id==='pya10Analysis'&&w.role!=='admin'&&w.role!=='supervisor'){alert('El análisis de clientes es exclusivo del Administrador y Supervisor.');return}oldShow(id,btn);employees();pya10Analysis();pending()}}function permissions(){let r=w.role;eb.style.display=r==='admin'?'':'none';ab.style.display=(r==='admin'||r==='supervisor')?'':'none';pb.style.display=(r==='admin'||r==='supervisor'||r==='empleado')?'':'none';let a=Array.from(nav.querySelectorAll('button')).find(x=>x.textContent.includes('Aprobaciones'));if(a)a.style.display=(r==='admin'||r==='supervisor')?'':'none';employees();pya10Analysis();pending()}permissions();setInterval(permissions,500)}f.addEventListener('load',start);setTimeout(start,400)})()</script></body></html>
